<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#8f1124">
  <title>找不到頁面｜兵果彩盤</title>
  <meta http-equiv="refresh" content="2; url=./">
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #fbf1dc; color: #2e1410; font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif; text-align: center; }
    a { color: #a8142a; font-weight: 700; }
  </style>
</head>
<body>
  <p>🧧 找不到這個頁面，正在回到首頁…<br><a href="./">立即回到兵果彩盤</a></p>
  <script>
    // GitHub Pages 專案網址（/<儲存庫>/）下，以相對路徑導回該專案的首頁
    var parts = location.pathname.split('/').filter(Boolean);
    var isUserSite = location.hostname.indexOf('github.io') === -1 || parts.length === 0;
    var base = isUserSite ? '/' : '/' + parts[0] + '/';
    location.replace(base);
  </script>
</body>
</html>
